[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "euler-preprocess"
version = "3.25.0"
description = "Physics-based preprocessing (fog, etc.) for RGB+depth datasets"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Daniel Rothenpieler", email = "rothenpielerdaniel@gmail.com" },
]
dependencies = [
  "numpy",
  "Pillow",
  "euler-loading>=2.35.0",
  "ds-crawler>=2.14.0",
  "euler-dataset-contract>=0.23.0",
]

[project.optional-dependencies]
gpu = [
  "torch",
]
progress = [
  "tqdm",
]

[project.scripts]
euler-preprocess = "euler_preprocess.cli:main"

# What this installation can run, for `euler-suite report` and euler-view
# (euler_dataset_contract.extensions): the entry-point name is the distribution.
# Other packages add transforms in the "euler.transforms" group; see the README.
[project.entry-points."euler.capabilities"]
euler-preprocess = "euler_preprocess.capabilities:transform_capability_report"

[tool.setuptools.packages.find]
include = ["euler_preprocess", "euler_preprocess.*"]
